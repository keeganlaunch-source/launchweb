<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LAUNCH HUB">
    <title>LAUNCH HUB - Private Analytics Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: radial-gradient(ellipse at top, #0a0e27 0%, #16213e 35%, #0f3460 100%);
            color: white; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a9c0;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .login-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
        }

        .dashboard {
            display: none;
            padding: 20px;
        }

        .header { 
            background: linear-gradient(135deg, rgba(15, 52, 96, 0.95) 0%, rgba(10, 14, 39, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            padding: 24px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 { 
            font-size: 2.5rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #fb7185 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .content { 
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
            margin-bottom: 40px;
        }

        .analytics-panel {
            background: linear-gradient(135deg, rgba(15, 52, 96, 0.4) 0%, rgba(10, 14, 39, 0.6) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #60a5fa;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 900;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .metric-label {
            font-size: 0.9rem;
            color: #a0a9c0;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #a0a9c0;
            padding: 40px;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <div class="logo">LAUNCH HUB</div>
            <div class="login-form">
                <div class="form-group">
                    <label for="password">Access Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <button class="login-btn" onclick="login()">Access Dashboard</button>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="header">
            <div class="header-content">
                <h1>LAUNCH HUB</h1>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div class="live-indicator">
                        <div class="live-dot"></div>
                        <span>Live Data</span>
                    </div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="dashboard-grid">
                <div class="analytics-panel">
                    <h2 class="panel-title">Business Intelligence</h2>
                    <div id="metricsContent" class="loading">Loading analytics data...</div>
                </div>

                <div class="analytics-panel">
                    <h2 class="panel-title">Real-Time Activity</h2>
                    <div id="activityContent" class="loading">Loading activity feed...</div>
                </div>
            </div>

            <div class="analytics-panel">
                <h2 class="panel-title">Revenue & Conversion Analytics</h2>
                <div id="revenueContent" class="loading">Loading revenue data...</div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = 'LaunchLifestyle2025!';
        let analyticsData = null;

        function login() {
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === CORRECT_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAnalytics();
            } else {
                errorMessage.textContent = 'Incorrect password. Please try again.';
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
            }
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('errorMessage').style.display = 'none';
        }

        async function loadAnalytics() {
            try {
                const response = await fetch('/api/analytics/comprehensive');
                analyticsData = await response.json();
                renderDashboard();
            } catch (error) {
                console.error('Failed to load analytics:', error);
                showError('Failed to load analytics data');
            }
        }

        function renderDashboard() {
            if (!analyticsData) return;

            // Business Intelligence Metrics
            const metricsHtml = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value">${analyticsData.eventCounts.total.pageViews.toLocaleString()}</div>
                        <div class="metric-label">Total Page Views</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${analyticsData.eventCounts.total.conversions}</div>
                        <div class="metric-label">Total Conversions</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">$${(analyticsData.revenueMetrics.totalRevenue || 0).toLocaleString()}</div>
                        <div class="metric-label">Total Revenue</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${((analyticsData.eventCounts.total.conversions / analyticsData.eventCounts.total.pageViews) * 100).toFixed(1)}%</div>
                        <div class="metric-label">Conversion Rate</div>
                    </div>
                </div>
                <div class="chart-container">
                    <div style="text-align: center;">
                        <h3 style="color: #60a5fa; margin-bottom: 10px;">Performance Overview</h3>
                        <p style="color: #a0a9c0;">Social Media Reach: ${analyticsData.socialMediaData.totalReach.toLocaleString()}</p>
                        <p style="color: #a0a9c0;">App Downloads: ${analyticsData.eventCounts.total.appDownloads}</p>
                        <p style="color: #a0a9c0;">Newsletter Signups: ${analyticsData.eventCounts.total.newsletterSignups}</p>
                    </div>
                </div>
            `;

            // Recent Activity
            const activityHtml = `
                <div style="max-height: 400px; overflow-y: auto;">
                    ${analyticsData.recentActivity.slice(0, 10).map(activity => `
                        <div style="background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; margin-bottom: 10px;">
                            <div style="font-size: 14px; color: #60a5fa;">${activity.eventType.replace('_', ' ').toUpperCase()}</div>
                            <div style="font-size: 12px; color: #a0a9c0;">${new Date(activity.timestamp).toLocaleString()}</div>
                            ${activity.location ? `<div style="font-size: 12px; color: #a0a9c0;">${activity.location}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;

            // Revenue Analytics
            const revenueHtml = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value">$${(analyticsData.revenueMetrics.monthlyRecurring || 0).toLocaleString()}</div>
                        <div class="metric-label">Monthly Recurring Revenue</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">$${(analyticsData.revenueMetrics.averageOrderValue || 0).toFixed(2)}</div>
                        <div class="metric-label">Average Order Value</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${(analyticsData.revenueMetrics.customerLifetimeValue || 0).toFixed(0)}</div>
                        <div class="metric-label">Customer Lifetime Value</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${analyticsData.funnelAnalytics.funnelStages.find(s => s.stage === 'subscription')?.conversionRate.toFixed(1) || 0}%</div>
                        <div class="metric-label">Subscription Rate</div>
                    </div>
                </div>
                <div class="chart-container">
                    <div style="text-align: center;">
                        <h3 style="color: #60a5fa; margin-bottom: 20px;">Conversion Funnel</h3>
                        ${analyticsData.funnelAnalytics.funnelStages.map(stage => `
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px;">
                                <span style="color: #a0a9c0;">${stage.customerAction}</span>
                                <span style="color: #60a5fa;">${stage.count.toLocaleString()} (${stage.conversionRate.toFixed(1)}%)</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('metricsContent').innerHTML = metricsHtml;
            document.getElementById('activityContent').innerHTML = activityHtml;
            document.getElementById('revenueContent').innerHTML = revenueHtml;
        }

        function showError(message) {
            document.getElementById('metricsContent').innerHTML = `<div style="color: #ef4444; text-align: center;">${message}</div>`;
            document.getElementById('activityContent').innerHTML = `<div style="color: #ef4444; text-align: center;">${message}</div>`;
            document.getElementById('revenueContent').innerHTML = `<div style="color: #ef4444; text-align: center;">${message}</div>`;
        }

        // Auto-refresh analytics every 30 seconds
        setInterval(() => {
            if (document.getElementById('dashboard').style.display === 'block') {
                loadAnalytics();
            }
        }, 30000);

        // Allow Enter key to login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
