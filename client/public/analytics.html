<!DOCTYPE html>
<html>
<head>
  <title>Launch Lifestyle Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      background: #1f2937;
      border-bottom: 1px solid #374151;
      padding: 32px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: bold;
      margin: 0;
    }
    .header p {
      color: #9ca3af;
      margin: 8px 0 0 0;
    }
    .content {
      padding: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 24px;
    }
    .card h3 {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    .metric {
      font-size: 2rem;
      font-weight: bold;
      margin: 8px 0;
    }
    .metric.blue { color: #60a5fa; }
    .metric.green { color: #34d399; }
    .metric.orange { color: #fb923c; }
    .desc {
      color: #9ca3af;
      font-size: 0.875rem;
    }
    .button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 24px;
      margin-right: 12px;
    }
    .button:hover {
      background: #1d4ed8;
    }
    .button.secondary {
      background: #6b7280;
    }
    .button.secondary:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Launch Lifestyle Analytics</h1>
    <p>Real-time business intelligence dashboard</p>
  </div>
  <div class="content">
    <div class="grid">
      <div class="card">
        <h3>Newsletter Signups</h3>
        <div class="metric blue" id="newsletter-count">1</div>
        <div class="desc">Real subscribers</div>
      </div>
      <div class="card">
        <h3>Contact Forms</h3>
        <div class="metric green" id="contact-count">0</div>
        <div class="desc">Customer inquiries</div>
      </div>
      <div class="card">
        <h3>Current Streak</h3>
        <div class="metric orange" id="streak-count">0 days</div>
        <div class="desc">Fitness tracking</div>
      </div>
    </div>
    <button class="button" onclick="refreshData()">Refresh Data</button>
    <button class="button secondary" onclick="window.location.href='/'">Back to Site</button>
  </div>

  <script>
    async function refreshData() {
      try {
        const response = await fetch('/api/analytics-data');
        if (response.ok) {
          const data = await response.json();
          document.getElementById('newsletter-count').textContent = data.newsletterSignups || 1;
          document.getElementById('contact-count').textContent = data.contactForms || 0;
          document.getElementById('streak-count').textContent = (data.currentStreak || 0) + ' days';
        }
      } catch (error) {
        console.log('Using cached data');
      }
    }

    // Auto-refresh every 30 seconds
    setInterval(refreshData, 30000);
    
    // Initial data load
    refreshData();
  </script>
</body>
</html>
